name: Keep Render Services Alive

on:
  # Hər 5 dəqiqədən bir avtomatik işə sal, YALNIZ Bakı vaxtı ilə 09:00-22:00 aralığında (05:00-18:00 UTC)
  schedule:
    - cron: '*/5 5-17 * * *'
  # Manual olaraq da işə sala bilərsiniz (Actions tab → Run workflow)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping qerarlari-avtomatik-yazdirma (yalnız 09:00-22:00 Bakı vaxtında)
        run: |
          hour=$(TZ="Asia/Baku" date +%H)
          echo "Bakı vaxtı: ${hour}:00"
          if [ "$hour" -ge 22 ] || [ "$hour" -lt 9 ]; then
            echo "🌙 Gecə saatları (22:00-09:00 Bakı) - bu aralıqda fəaliyyət dayandırılıb, ping göndərilmir."
            exit 0
          fi
          echo "Keep-alive ping - $(date -u)"
          echo "================================"
          url="https://qerarlari-avtomatik-yazdirma.onrender.com/"
          echo "→ Pinging: $url"
          status=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 -L "$url" || echo "TIMEOUT")
          echo "  Status: $status"
          if [ "$status" = "200" ]; then
            echo "  ✅ UP"
          elif [ "$status" = "TIMEOUT" ]; then
            echo "  ⏱️ TIMEOUT (sayt cold start ola bilər)"
          else
            echo "  ⚠️ Got $status"
          fi
          echo ""
          echo "================================"
          echo "Ping tamamlandı"
